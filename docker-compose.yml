services:
  web:
    build:
      context: .
      target: dev
      args:
        UV_SYNC_ARGS: '--all-groups'
    ports:
      - '${PORT:-8000}:${PORT:-8000}'
    environment:
      DJANGO_SETTINGS_MODULE: apps.guide.settings.dev
      DATABASE_URL: postgres://guide@db/guide # pragma: allowlist secret
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - staticfiles:/app/static
      # Keeps node_modules (installed into the dev image, see Dockerfile) from
      # being shadowed by the bind mount above. Since Docker keeps this
      # directory's contents separate from the host, run npm/Node commands
      # consistently from inside the container (not from the host) so they
      # see the same node_modules.
      - node_modules:/app/node_modules
    command:
      - uv
      - run
      - python
      - manage.py
      - runserver
      - '0.0.0.0:${PORT:-8000}'
    init: true
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      # Location of DB data folder
      PGDATA: /var/lib/postgresql/data/pgdata
      # Defaults for createdb/dropdb/pg_restore etc.
      PGDATABASE: guide
      PGUSER: guide
      # Values for initdb
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: guide
    volumes:
      - pgdata:/var/lib/postgresql/data
    attach: false
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guide']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  staticfiles:
  node_modules:
  pgdata:
