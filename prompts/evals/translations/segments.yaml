# Shared translation eval segments — single source of truth for both the
# Promptfoo eval (referenced from translations.yaml via `tests: file://`)
# and the Inspect AI eval (loaded by translations-inspect_ai/translation_task.py).
#
# Each entry is a Promptfoo test case (description, vars, metadata); Inspect
# maps it to a Sample (id=metadata.id, input=vars.text, metadata=metadata).
#
# Segments are extracted verbatim from real guide content, as the
# wagtail-localize HTML segments the translator receives: markdown links
# become <a id="..."> and **bold** UI labels become <b>.

- description: Plain prose, no markup (page intro)
  metadata:
    id: manage-documents-intro
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Documents such as PDFs can be managed from the Documents interface, available in the left-hand menu.'

- description: Link with id — link text translated
  metadata:
    id: manage-documents-link
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'You can manage documents such as PDF files from the <a id="a1">Documents interface</a>.'

- description: Bold UI label with official translation, plus a link
  metadata:
    id: manage-documents-sidebar
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'To access the Documents interface, click <b>Documents</b> in the <a id="a2">Sidebar</a>.'

- description: Bold label with official translation, repeated term in prose
  metadata:
    id: manage-documents-add
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Add documents by clicking <b>Add documents</b> at the top right of the documents interface.'

- description: Multi-sentence segment with one bold label (Collection)
  metadata:
    id: manage-documents-collection
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Search for previously added documents by entering the title of the document in the search bar. The results automatically update as you type. You can also filter the results by Collection by selecting a collection from the <b>Collection</b> dropdown preceding the documents list.'

- description: Bold label (Save) and link at end of a long sentence
  metadata:
    id: manage-documents-save
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Once you are done editing a document, save your edits by clicking <b>Save</b> at the bottom of the <a id="a3">edit screen</a>.'

- description: Bold label (Delete) with official translation
  metadata:
    id: manage-documents-delete
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Then click <b>Delete</b> from the action bar displayed at the bottom of the Documents interface.'

- description: Repeated link text plus compound label (Delete document)
  metadata:
    id: manage-documents-delete-document
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'You can also delete a document and its record from the <a id="a4">edit screen</a> when editing a document by clicking <b>Delete document</b> at the bottom of the <a id="a5">edit screen</a>.'

- description: Short warning callout
  metadata:
    id: manage-documents-warning
    source: prompts/content/en/how-to-guides/manage-documents.md
  vars:
    text: 'Warning: Deleted documents cannot be recovered.'

- description: Long plain prose with product terminology
  metadata:
    id: new-in-7-4-autosave
    source: prompts/content/en/releases/new-in-wagtail-7-4.md
  vars:
    text: 'The autosave and concurrent editing notifications introduced in Wagtail 7.3 have been refined based on user feedback. Race conditions and brief network outages are handled more gracefully, the indicator messaging and alignment have been polished, and you can now distinguish which other users are active or idle while looking at the same page or snippet.'

- description: Bold label without an official translation — translated freely
  metadata:
    id: new-in-7-4-add-block
    source: prompts/content/en/releases/new-in-wagtail-7-4.md
  vars:
    text: 'Block-based content now lists block groups in the order developers defined them, making the <b>Add block</b> menu more predictable.'

- description: Bold multi-word label without an official translation
  metadata:
    id: new-in-7-4-workflow
    source: prompts/content/en/releases/new-in-wagtail-7-4.md
  vars:
    text: "The <b>Submit to workflow</b> menu now uses the workflow's name when creating a new page."

- description: Long segment with two links and proper nouns kept intact
  metadata:
    id: new-in-7-4-security
    source: prompts/content/en/releases/new-in-wagtail-7-4.md
  vars:
    text: 'Wagtail recently underwent an <a id="a6">independent code security audit</a> commissioned by the <a id="a7">Interministerial Digital Directorate (DINUM)</a> of France.'
