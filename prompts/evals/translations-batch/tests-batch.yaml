    src_doc: '<document>

      <segment id="s1">Create new pages</segment>

      <segment id="s2">To create a new page, click the <b>Add</b> button at the top of page. This creates
      a child page of the section you are currently in. In this case, a child page of the <b>Breads</b>
      page. There are other actions relating to pages available in the <b>Actions</b> menu next to the
      Add button:</segment>

      <segment id="s3">Autosave</segment>

      <segment id="s4">When making changes to a new or existing page, the page editor will periodically
      automatically save the page contents. This functionality is available for all page types by default,
      as well as <a id="a0">snippets</a> when configured by site implementers.</segment>

      <segment id="s5">In addition to autosaving, the editor will also alert users of possible concurrent
      editing conflicts when multiple users are working on the same content. And flag internet connectivity
      and network issues that pop up as you work.</segment>

      <segment id="s6">Edit existing pages</segment>

      <segment id="s7">You can access an existing page''s <a id="a1">edit screen</a> in three ways.</segment>

      <segment id="s8">First, by clicking <b>… Actions</b> and then select the Edit option from the dropdown.
      Second, by clicking the page''s title if you are accessing the page from its parent''s Explorer
      page or in search results. Last, if you are accessing the page from the <a id="a2">Explorer page</a>
      of its parent, you can hover over the page and then click Edit.</segment>

      <segment id="s9">On the <a id="a3">edit screen</a>, you can find the title of the page you are editing
      at the top of the page. If the page is already published, then you can find a link to the live version
      of the page at the top right of the page. To change the title of the page, click the title field
      and enter a new title.</segment>

      <segment id="s10">Validation errors</segment>

      <segment id="s11">Clicking "Save draft" will save the latest changes as a draft, skipping form fields
      validation where possible. Clicking "Publish" always runs all available form field validation. When
      errors are present, they are all displayed directly within the form, with an overview message at
      the top of the page, including a shortcut to go to the first error:</segment>

      <segment id="s12">Available actions</segment>

      <segment id="s13">While on the <a id="a4">edit screen</a>, you can perform several actions, such
      as copying, moving, or deleting a page. To perform any of these actions, click <b>… Actions</b>
      at the top of the <a id="a5">edit screen</a> and select the applicable option from the dropdown.</segment>

      <segment id="s14">Edit block content</segment>

      <segment id="s15">Wagtail’s block-based editing is called StreamField. It’s a key feature of the
      CMS, that gives editors creative control over content.</segment>

      <segment id="s16">Within block-based StreamField, editors can:</segment>

      <segment id="s17">Insert blocks – as a list where all blocks are of the same type, or as a stream
      with multiple supported block types.</segment>

      <segment id="s18">Reorder blocks – with up and down controls, or drag and drop.</segment>

      <segment id="s19">Duplicate blocks - to speed up content entry.</segment>

      <segment id="s20">Remove blocks.</segment>

      <segment id="s21">Within blocks, the same fields are used as other aspects of the page. Or often,
      blocks can be nested within other blocks.</segment>

      <segment id="s22">The same block-based interface is also available for more structured data, often
      combined with <a id="a6">snippets</a>, with minor differences in capabilities (for example absence
      of "duplicate" option:</segment>

      <segment id="s23">Block chooser</segment>

      <segment id="s24">Clicking the "+" Add button, the block chooser appears. It allows the user to
      choose between available block types, which vary depending on configuration of the page and field.</segment>

      <segment id="s25">If configured, blocks can display a preview of how they would display on the site
      and description of their intended use.</segment>

      <segment id="s26">Create and edit comments</segment>

      <segment id="s27">To toggle on commenting mode, click <b>Comments</b> at the top of the <a id="a7">edit
      screen</a> page. Once commenting mode is on, you can create a new comment or reply to a comment
      by hovering over any commentable field to reveal the add comment icon.</segment>

      <segment id="s28">If there is no pre-existing comment in the field, click the add comment icon to
      create a new comment. However, if there is an existing comment, clicking either the field button
      or the comment brings the comment thread into focus. This allows you to add new replies.</segment>

      <segment id="s29">To comment on the text within the rich text field, highlight the text and then
      click the add comment icon to add an inline comment.</segment>

      <segment id="s30">Alternatively, you can perform all of these actions using the comment shortcut,
      Ctrl + Alt + M on Windows and ⌘ + Alt + M on macOS.</segment>

      <segment id="s31">To edit, delete, or resolve a comment, click the three vertical dots in the top
      right of an existing comment and select the applicable option. Saving the page after leaving a comment
      or replying to a comment saves the comment or reply.</segment>

      <segment id="s32">Note: Currently, fields inside <b>InlinePanels</b> and <b>ListBlocks</b> are uncommentable.</segment>

      <segment id="s33">The arrow to the right of the comments icon shows the comment notifications panel,
      where you can enable or disable email notifications for other users'' comments on the page.</segment>

      <segment id="s34">Note: You will always receive email notifications for threads you are part of,
      unless you opt out of all comment notifications in your account settings.</segment>

      <segment id="s35">All participants in a thread will receive email notifications for new replies,
      even if they no longer have permission to edit the page.</segment>

      <segment id="s36">Concurrent editing notifications</segment>

      <segment id="s37">When multiple users concurrently work on the same content, Wagtail displays notifications
      to inform them of potential editing conflicts. Those notifications initially appear as user avatars
      in the page header, each with a status tooltip.</segment>

      <segment id="s38">When a user saves their work, other users are informed and presented with options:
      they can refresh the page to view the latest changes, or proceed with their own changes, overwriting
      the other user''s work.</segment>

      <segment id="s39">Users are displayed as "active" in concurrent editing notifications until they
      switch to another application or close the browser tab, or after a set timeout.</segment>

      <segment id="s40">Manage page privacy</segment>

      <segment id="s41">Users with publish permission on a page can set it to be private by clicking the
      ‘Change privacy’ control in the status panel. This sets a restriction on who is allowed to view
      the page, and its <a id="a8">child pages</a>. Several options are available:</segment>

      <segment id="s42"><b>Public</b>: the page is accessible to anyone who can access the website.</segment>

      <segment id="s43"><b>Accessible to any logged-in users:</b> The user must log in to view the page.
      All user accounts are granted access, regardless of permission level.</segment>

      <segment id="s44"><b>Accessible with a shared password:</b> The user must enter the given shared
      password to view the page. This is appropriate for situations where you want to share a page with
      a trusted group of people, but giving them individual user accounts would be overkill. The same
      password is shared between all users, and this works independently of any user accounts that exist
      on the site.</segment>

      <segment id="s45"><b>Accessible to users in specific groups:</b> The user must be logged in, and
      a member of one or more of the <a id="a9">specified groups</a>, in order to view the page.</segment>

      <segment id="s46">Warning: Shared passwords should not be used to protect sensitive content, as
      the password is shared between all users, and stored in plain text in the database. Where possible,
      it’s recommended to require users log in to access private page content.</segment>

      <segment id="s47">Manage page history</segment>

      <segment id="s48">Wagtail allows you to retrieve the version of the content you previously saved
      as a draft or published. You can do this by hovering over a page on the <a id="a10">Explorer page</a>
      and clicking <b>More</b> from the resulting dropdown options. Alternatively, you can access the
      page history screen by clicking the <b>History</b> icon in the top-right corner when editing a page.</segment>

      <segment id="s49">On the page''s history screen, you can see all the actions previously done on
      that particular page and the users that carried out the actions. Also, you can see the date or time
      that the action occurred.</segment>

      <segment id="s50">You can also search for specific versions of your content on the page history
      screen by applying a filter.</segment>

      <segment id="s51">If you want to compare different draft versions, hover over the draft and click
      <b>Compare with previous version</b> or <b>Compare with current version</b>.</segment>

      <segment id="s52">To replace the current version of the draft with a previous version, hover over
      the preferred version of your draft on the page history screen and click <b>Review this version</b>.
      Then click <b>Replace current version</b> located at the bottom of the screen. This action appears
      as a _Revert_ action on the page history screen and you can always go back to review it.</segment>

      <segment id="s53">Workflow</segment>

      <segment id="s54">If the page is currently in a workflow, then you can see an additional indicator
      underneath the title showing the current workflow task. Clicking this shows more information about
      the page''s progress through the workflow and any comments left by reviewers.</segment>

      <segment id="s55">If you have permission to perform moderation actions, for example, approval or
      requesting changes on the current task. In that case, you can see additional options in the action
      bar at the bottom of the page.</segment>

      <segment id="s56">Copy pages</segment>

      <segment id="s57">Sometimes, you don''t need to create a new page from scratch. For example, you
      may have several pages that are similar in terms of structure but differ in content. In that case,
      you can copy an existing page and only change the required parts.</segment>

      <segment id="s58">To copy an existing page, hover over a page in an <a id="a11">Explorer page</a>,
      then click <b>More</b> and select <b>Copy</b>. Selecting <b>Copy</b> from the dropdown takes you
      to a form where you can enter the title and slug of the copy and also choose its parent page. You
      then get the option to publish the copy right away and an option to mark the copy as an alias of
      the original page. Once you have completed the form, click <b>Copy this page</b>.</segment>

      <segment id="s59">Congratulations, you just copied a page. You can now find your copied page on
      the Explorer page.</segment>

      <segment id="s60">Alias pages</segment>

      <segment id="s61">When copying a page, you have the option to mark it as an alias. The content of
      an aliased page always stays in sync with the original.</segment>

      <segment id="s62">This is useful when you want a page to be available in multiple places. For example,
      if you have a page about Brioche as a child page of Breads, and you want to make the Brioche page
      available in the Pastries section. One way to do this is to create a copy of the Brioche page and
      change the parent page to the Pastries page. However, you now need to remember to update this copy
      each time you modify the original page. If you mark a copy as an alias, Wagtail automatically makes
      changes to the copy each time you modify and publish the original page.</segment>

      <segment id="s63">Creating an alias for an existing page is similar to creating a copy. Hover over
      a page in the <a id="a12">Explorer page</a>, click <b>More</b>, and then select <b>Copy</b>. Selecting
      <b>Copy</b> takes you to the copy page form. On the copy page form, choose another page as the parent
      page by clicking Choose another page.</segment>

      <segment id="s64">Then, click the <b>Alias</b> checkbox and click <b>Copy this page</b> to complete
      the aliasing.</segment>

      <segment id="s65">Congratulations, you just aliased a page. You can now find your aliased page on
      the <a id="a13">Explorer page</a> of the parent page.</segment>

      <segment id="s66">If you try to edit the aliased page, you get a notification that it''s an alias
      of another page. To edit an aliased page, you have two options:</segment>

      <segment id="s67">Edit the original page. This option changes both the original page and the aliased
      page.</segment>

      <segment id="s68">Convert the alias page to an ordinary page, which is a copy of the original. If
      you choose this option, you must make manual changes to the alias page in order for it to be in
      sync with the original page.</segment>

      </document>'
