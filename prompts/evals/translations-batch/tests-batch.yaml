      "text": "While on the <a id=\"a4\">edit screen</a>, you can perform several actions, such as copying,
      moving, or deleting a page. To perform any of these actions, click <b>… Actions</b> at the top of
      the <a id=\"a5\">edit screen</a> and select the applicable option from the dropdown."}, {"id": "s14",
      "text": "Edit block content"}, {"id": "s15", "text": "Wagtail’s block-based editing is called StreamField.
      It’s a key feature of the CMS, that gives editors creative control over content."}, {"id": "s16",
      "text": "Within block-based StreamField, editors can:"}, {"id": "s17", "text": "Insert blocks –
      as a list where all blocks are of the same type, or as a stream with multiple supported block types."},
      {"id": "s18", "text": "Reorder blocks – with up and down controls, or drag and drop."}, {"id": "s19",
      "text": "Duplicate blocks - to speed up content entry."}, {"id": "s20", "text": "Remove blocks."},
      {"id": "s21", "text": "Within blocks, the same fields are used as other aspects of the page. Or
      often, blocks can be nested within other blocks."}, {"id": "s22", "text": "The same block-based
      interface is also available for more structured data, often combined with <a id=\"a6\">snippets</a>,
      with minor differences in capabilities (for example absence of \"duplicate\" option:"}, {"id": "s23",
      "text": "Block chooser"}, {"id": "s24", "text": "Clicking the \"+\" Add button, the block chooser
      appears. It allows the user to choose between available block types, which vary depending on configuration
      of the page and field."}, {"id": "s25", "text": "If configured, blocks can display a preview of
      how they would display on the site and description of their intended use."}, {"id": "s26", "text":
      "Create and edit comments"}, {"id": "s27", "text": "To toggle on commenting mode, click <b>Comments</b>
      at the top of the <a id=\"a7\">edit screen</a> page. Once commenting mode is on, you can create
      a new comment or reply to a comment by hovering over any commentable field to reveal the add comment
      icon."}, {"id": "s28", "text": "If there is no pre-existing comment in the field, click the add
      comment icon to create a new comment. However, if there is an existing comment, clicking either
      the field button or the comment brings the comment thread into focus. This allows you to add new
      replies."}, {"id": "s29", "text": "To comment on the text within the rich text field, highlight
      the text and then click the add comment icon to add an inline comment."}, {"id": "s30", "text":
      "Alternatively, you can perform all of these actions using the comment shortcut, Ctrl + Alt + M
      on Windows and ⌘ + Alt + M on macOS."}, {"id": "s31", "text": "To edit, delete, or resolve a comment,
      click the three vertical dots in the top right of an existing comment and select the applicable
      option. Saving the page after leaving a comment or replying to a comment saves the comment or reply."},
      {"id": "s32", "text": "Note: Currently, fields inside <b>InlinePanels</b> and <b>ListBlocks</b>
      are uncommentable."}, {"id": "s33", "text": "The arrow to the right of the comments icon shows the
      comment notifications panel, where you can enable or disable email notifications for other users''
      comments on the page."}, {"id": "s34", "text": "Note: You will always receive email notifications
      for threads you are part of, unless you opt out of all comment notifications in your account settings."},
      {"id": "s35", "text": "All participants in a thread will receive email notifications for new replies,
      even if they no longer have permission to edit the page."}, {"id": "s36", "text": "Concurrent editing
      notifications"}, {"id": "s37", "text": "When multiple users concurrently work on the same content,
      Wagtail displays notifications to inform them of potential editing conflicts. Those notifications
      initially appear as user avatars in the page header, each with a status tooltip."}, {"id": "s38",
      "text": "When a user saves their work, other users are informed and presented with options: they
      can refresh the page to view the latest changes, or proceed with their own changes, overwriting
      the other user''s work."}, {"id": "s39", "text": "Users are displayed as \"active\" in concurrent
      editing notifications until they switch to another application or close the browser tab, or after
      a set timeout."}, {"id": "s40", "text": "Manage page privacy"}, {"id": "s41", "text": "Users with
      publish permission on a page can set it to be private by clicking the ‘Change privacy’ control in
      the status panel. This sets a restriction on who is allowed to view the page, and its <a id=\"a8\">child
      pages</a>. Several options are available:"}, {"id": "s42", "text": "<b>Public</b>: the page is accessible
      to anyone who can access the website."}, {"id": "s43", "text": "<b>Accessible to any logged-in users:</b>
      The user must log in to view the page. All user accounts are granted access, regardless of permission
      level."}, {"id": "s44", "text": "<b>Accessible with a shared password:</b> The user must enter the
      given shared password to view the page. This is appropriate for situations where you want to share
      a page with a trusted group of people, but giving them individual user accounts would be overkill.
      The same password is shared between all users, and this works independently of any user accounts
      that exist on the site."}, {"id": "s45", "text": "<b>Accessible to users in specific groups:</b>
      The user must be logged in, and a member of one or more of the <a id=\"a9\">specified groups</a>,
      in order to view the page."}, {"id": "s46", "text": "Warning: Shared passwords should not be used
      to protect sensitive content, as the password is shared between all users, and stored in plain text
      in the database. Where possible, it’s recommended to require users log in to access private page
      content."}, {"id": "s47", "text": "Manage page history"}, {"id": "s48", "text": "Wagtail allows
      you to retrieve the version of the content you previously saved as a draft or published. You can
      do this by hovering over a page on the <a id=\"a10\">Explorer page</a> and clicking <b>More</b>
      from the resulting dropdown options. Alternatively, you can access the page history screen by clicking
      the <b>History</b> icon in the top-right corner when editing a page."}, {"id": "s49", "text": "On
      the page''s history screen, you can see all the actions previously done on that particular page
      and the users that carried out the actions. Also, you can see the date or time that the action occurred."},
      {"id": "s50", "text": "You can also search for specific versions of your content on the page history
      screen by applying a filter."}, {"id": "s51", "text": "If you want to compare different draft versions,
      hover over the draft and click <b>Compare with previous version</b> or <b>Compare with current version</b>."},
      {"id": "s52", "text": "To replace the current version of the draft with a previous version, hover
      over the preferred version of your draft on the page history screen and click <b>Review this version</b>.
      Then click <b>Replace current version</b> located at the bottom of the screen. This action appears
      as a _Revert_ action on the page history screen and you can always go back to review it."}, {"id":
      "s53", "text": "Workflow"}, {"id": "s54", "text": "If the page is currently in a workflow, then
      you can see an additional indicator underneath the title showing the current workflow task. Clicking
      this shows more information about the page''s progress through the workflow and any comments left
      by reviewers."}, {"id": "s55", "text": "If you have permission to perform moderation actions, for
      example, approval or requesting changes on the current task. In that case, you can see additional
      options in the action bar at the bottom of the page."}, {"id": "s56", "text": "Copy pages"}, {"id":
      "s57", "text": "Sometimes, you don''t need to create a new page from scratch. For example, you may
      have several pages that are similar in terms of structure but differ in content. In that case, you
      can copy an existing page and only change the required parts."}, {"id": "s58", "text": "To copy
      an existing page, hover over a page in an <a id=\"a11\">Explorer page</a>, then click <b>More</b>
      and select <b>Copy</b>. Selecting <b>Copy</b> from the dropdown takes you to a form where you can
      enter the title and slug of the copy and also choose its parent page. You then get the option to
      publish the copy right away and an option to mark the copy as an alias of the original page. Once
      you have completed the form, click <b>Copy this page</b>."}, {"id": "s59", "text": "Congratulations,
      you just copied a page. You can now find your copied page on the Explorer page."}, {"id": "s60",
      "text": "Alias pages"}, {"id": "s61", "text": "When copying a page, you have the option to mark
      it as an alias. The content of an aliased page always stays in sync with the original."}, {"id":
      "s62", "text": "This is useful when you want a page to be available in multiple places. For example,
      if you have a page about Brioche as a child page of Breads, and you want to make the Brioche page
      available in the Pastries section. One way to do this is to create a copy of the Brioche page and
      change the parent page to the Pastries page. However, you now need to remember to update this copy
      each time you modify the original page. If you mark a copy as an alias, Wagtail automatically makes
      changes to the copy each time you modify and publish the original page."}, {"id": "s63", "text":
      "Creating an alias for an existing page is similar to creating a copy. Hover over a page in the
      <a id=\"a12\">Explorer page</a>, click <b>More</b>, and then select <b>Copy</b>. Selecting <b>Copy</b>
      takes you to the copy page form. On the copy page form, choose another page as the parent page by
      clicking Choose another page."}, {"id": "s64", "text": "Then, click the <b>Alias</b> checkbox and
      click <b>Copy this page</b> to complete the aliasing."}, {"id": "s65", "text": "Congratulations,
      you just aliased a page. You can now find your aliased page on the <a id=\"a13\">Explorer page</a>
      of the parent page."}, {"id": "s66", "text": "If you try to edit the aliased page, you get a notification
      that it''s an alias of another page. To edit an aliased page, you have two options:"}, {"id": "s67",
      "text": "Edit the original page. This option changes both the original page and the aliased page."},
      {"id": "s68", "text": "Convert the alias page to an ordinary page, which is a copy of the original.
      If you choose this option, you must make manual changes to the alias page in order for it to be
      in sync with the original page."}]'
