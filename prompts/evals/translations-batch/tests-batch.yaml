    src_doc: '<document>

      <segment id="s1">The User Guide is a website to help content editors, moderators, administrators,
      and other users learn how to use the Wagtail content management system (CMS).</segment>

      <segment id="s2">The User Guide is a website to help content editors, moderators, administrators,
      and other users learn how to use <a id="a0">Wagtail</a>, the leading open source Python content
      management system (CMS). It’s comprehensive documentation for CMS users, including reference information
      on the admin features, how-tos, and more.</segment>

      <segment id="s3">AI-friendly documentation</segment>

      <segment id="s4">For users of Large Language Models (LLMs), the user guide contents are available
      in LLM-friendly formats:</segment>

      <segment id="s5"><a id="a1">llms.txt</a>, an LLM-focused index of all site contents.</segment>

      <segment id="s6"><a id="a2">llms-full.txt</a>, a full copy of the documentation</segment>

      <segment id="s7"><a id="a3">llms-prompt.txt</a>, an opinionated prompt you can copy-paste into your
      preferred AI tool so it answers questions based on the site’s contents.</segment>

      <segment id="s8">Let us know if this is useful to you in our <a id="a4">llms.txt feedback discussion
      thread</a>.</segment>

      <segment id="s9">Community resources</segment>

      <segment id="s10">Beyond the user guide documentation pages, here are other opportunities to find
      out more about Wagtail, contribute to the project, and chat with others in our community.</segment>

      <segment id="s11">Issues and feature requests</segment>

      <segment id="s12">If you think you’ve found a bug in Wagtail, or you’d like to suggest a new feature,
      please check our <a id="a5">issue tracker in GitHub</a>. If your bug or suggestion isn’t there,
      raise a new issue, providing as much relevant context as possible.</segment>

      <segment id="s13">Community events</segment>

      <segment id="s14">We organize or take part in multiple events every year - check out our <a id="a6">Wagtail
      events list</a>.</segment>

      </document>'
