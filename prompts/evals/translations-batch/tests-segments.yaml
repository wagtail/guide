    id: manage-pages-s9
    doc_id: manage-pages
  vars:
    text:
      On the <a id="a3">edit screen</a>, you can find the title of the page you are editing at the
      top of the page. If the page is already published, then you can find a link to the live version
      of the page at the top right of the page. To change the title of the page, click the title field
      and enter a new title.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s10'
  metadata:
