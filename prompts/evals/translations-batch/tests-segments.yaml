- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s20'
  metadata:
    id: manage-pages-s20
    doc_id: manage-pages
  vars:
    text: Remove blocks.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s21'
  metadata:
    id: manage-pages-s21
    doc_id: manage-pages
  vars:
    text:
      Within blocks, the same fields are used as other aspects of the page. Or often, blocks can be
