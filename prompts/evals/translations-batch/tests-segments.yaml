- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s22'
  metadata:
    id: manage-pages-s22
    doc_id: manage-pages
  vars:
    text:
      'The same block-based interface is also available for more structured data, often combined with
      <a id="a6">snippets</a>, with minor differences in capabilities (for example absence of "duplicate"
      option:'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s23'
  metadata:
    id: manage-pages-s23
    doc_id: manage-pages
  vars:
    text: Block chooser
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s24'
  metadata:
    id: manage-pages-s24
    doc_id: manage-pages
  vars:
    text:
      Clicking the "+" Add button, the block chooser appears. It allows the user to choose between
      available block types, which vary depending on configuration of the page and field.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s25'
  metadata:
    id: manage-pages-s25
    doc_id: manage-pages
  vars:
    text:
      If configured, blocks can display a preview of how they would display on the site and description
      of their intended use.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s26'
  metadata:
    id: manage-pages-s26
    doc_id: manage-pages
  vars:
    text: Create and edit comments
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s27'
  metadata:
    id: manage-pages-s27
    doc_id: manage-pages
  vars:
    text:
      To toggle on commenting mode, click <b>Comments</b> at the top of the <a id="a7">edit screen</a>
      page. Once commenting mode is on, you can create a new comment or reply to a comment by hovering
      over any commentable field to reveal the add comment icon.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s28'
  metadata:
    id: manage-pages-s28
    doc_id: manage-pages
  vars:
    text:
      If there is no pre-existing comment in the field, click the add comment icon to create a new
      comment. However, if there is an existing comment, clicking either the field button or the comment
      brings the comment thread into focus. This allows you to add new replies.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s29'
  metadata:
    id: manage-pages-s29
    doc_id: manage-pages
  vars:
    text:
      To comment on the text within the rich text field, highlight the text and then click the add
      comment icon to add an inline comment.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s30'
  metadata:
    id: manage-pages-s30
    doc_id: manage-pages
  vars:
    text:
      Alternatively, you can perform all of these actions using the comment shortcut, Ctrl + Alt +
      M on Windows and ⌘ + Alt + M on macOS.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s31'
  metadata:
    id: manage-pages-s31
    doc_id: manage-pages
  vars:
    text:
      To edit, delete, or resolve a comment, click the three vertical dots in the top right of an
      existing comment and select the applicable option. Saving the page after leaving a comment or replying
      to a comment saves the comment or reply.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s32'
  metadata:
    id: manage-pages-s32
    doc_id: manage-pages
  vars:
    text: 'Note: Currently, fields inside <b>InlinePanels</b> and <b>ListBlocks</b> are uncommentable.'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s33'
  metadata:
    id: manage-pages-s33
    doc_id: manage-pages
  vars:
    text:
      The arrow to the right of the comments icon shows the comment notifications panel, where you
      can enable or disable email notifications for other users' comments on the page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s34'
  metadata:
    id: manage-pages-s34
    doc_id: manage-pages
  vars:
    text:
      'Note: You will always receive email notifications for threads you are part of, unless you opt
      out of all comment notifications in your account settings.'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s35'
  metadata:
    id: manage-pages-s35
    doc_id: manage-pages
  vars:
    text:
      All participants in a thread will receive email notifications for new replies, even if they
      no longer have permission to edit the page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s36'
  metadata:
    id: manage-pages-s36
    doc_id: manage-pages
  vars:
    text: Concurrent editing notifications
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s37'
  metadata:
    id: manage-pages-s37
    doc_id: manage-pages
  vars:
    text:
      When multiple users concurrently work on the same content, Wagtail displays notifications to
      inform them of potential editing conflicts. Those notifications initially appear as user avatars
      in the page header, each with a status tooltip.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s38'
  metadata:
    id: manage-pages-s38
    doc_id: manage-pages
  vars:
    text:
      "When a user saves their work, other users are informed and presented with options: they can
      refresh the page to view the latest changes, or proceed with their own changes, overwriting the
      other user's work."
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s39'
  metadata:
    id: manage-pages-s39
    doc_id: manage-pages
  vars:
    text:
      Users are displayed as "active" in concurrent editing notifications until they switch to another
      application or close the browser tab, or after a set timeout.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s40'
  metadata:
    id: manage-pages-s40
    doc_id: manage-pages
  vars:
    text: Manage page privacy
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s41'
  metadata:
    id: manage-pages-s41
    doc_id: manage-pages
  vars:
    text:
      'Users with publish permission on a page can set it to be private by clicking the ‘Change privacy’
      control in the status panel. This sets a restriction on who is allowed to view the page, and its
      <a id="a8">child pages</a>. Several options are available:'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s42'
  metadata:
    id: manage-pages-s42
    doc_id: manage-pages
  vars:
    text: '<b>Public</b>: the page is accessible to anyone who can access the website.'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s43'
  metadata:
    id: manage-pages-s43
    doc_id: manage-pages
  vars:
    text:
      <b>Accessible to any logged-in users:</b> The user must log in to view the page. All user accounts
      are granted access, regardless of permission level.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s44'
  metadata:
    id: manage-pages-s44
    doc_id: manage-pages
  vars:
    text:
      <b>Accessible with a shared password:</b> The user must enter the given shared password to view
      the page. This is appropriate for situations where you want to share a page with a trusted group
      of people, but giving them individual user accounts would be overkill. The same password is shared
      between all users, and this works independently of any user accounts that exist on the site.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s45'
  metadata:
    id: manage-pages-s45
    doc_id: manage-pages
  vars:
    text:
      <b>Accessible to users in specific groups:</b> The user must be logged in, and a member of one
      or more of the <a id="a9">specified groups</a>, in order to view the page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s46'
  metadata:
    id: manage-pages-s46
    doc_id: manage-pages
  vars:
    text:
      'Warning: Shared passwords should not be used to protect sensitive content, as the password
      is shared between all users, and stored in plain text in the database. Where possible, it’s recommended
      to require users log in to access private page content.'
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s47'
  metadata:
    id: manage-pages-s47
    doc_id: manage-pages
  vars:
    text: Manage page history
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s48'
  metadata:
    id: manage-pages-s48
    doc_id: manage-pages
  vars:
    text:
      Wagtail allows you to retrieve the version of the content you previously saved as a draft or
      published. You can do this by hovering over a page on the <a id="a10">Explorer page</a> and clicking
      <b>More</b> from the resulting dropdown options. Alternatively, you can access the page history
      screen by clicking the <b>History</b> icon in the top-right corner when editing a page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s49'
  metadata:
    id: manage-pages-s49
    doc_id: manage-pages
  vars:
    text:
      On the page's history screen, you can see all the actions previously done on that particular
      page and the users that carried out the actions. Also, you can see the date or time that the action
      occurred.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s50'
  metadata:
    id: manage-pages-s50
    doc_id: manage-pages
  vars:
    text:
      You can also search for specific versions of your content on the page history screen by applying
      a filter.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s51'
  metadata:
    id: manage-pages-s51
    doc_id: manage-pages
  vars:
    text:
      If you want to compare different draft versions, hover over the draft and click <b>Compare with
      previous version</b> or <b>Compare with current version</b>.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s52'
  metadata:
    id: manage-pages-s52
    doc_id: manage-pages
  vars:
    text:
      To replace the current version of the draft with a previous version, hover over the preferred
      version of your draft on the page history screen and click <b>Review this version</b>. Then click
      <b>Replace current version</b> located at the bottom of the screen. This action appears as a _Revert_
      action on the page history screen and you can always go back to review it.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s53'
  metadata:
    id: manage-pages-s53
    doc_id: manage-pages
  vars:
    text: Workflow
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s54'
  metadata:
    id: manage-pages-s54
    doc_id: manage-pages
  vars:
    text:
      If the page is currently in a workflow, then you can see an additional indicator underneath
      the title showing the current workflow task. Clicking this shows more information about the page's
      progress through the workflow and any comments left by reviewers.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s55'
  metadata:
    id: manage-pages-s55
    doc_id: manage-pages
  vars:
    text:
      If you have permission to perform moderation actions, for example, approval or requesting changes
      on the current task. In that case, you can see additional options in the action bar at the bottom
      of the page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s56'
  metadata:
    id: manage-pages-s56
    doc_id: manage-pages
  vars:
    text: Copy pages
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s57'
  metadata:
    id: manage-pages-s57
    doc_id: manage-pages
  vars:
    text:
      Sometimes, you don't need to create a new page from scratch. For example, you may have several
      pages that are similar in terms of structure but differ in content. In that case, you can copy an
      existing page and only change the required parts.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s58'
  metadata:
    id: manage-pages-s58
    doc_id: manage-pages
  vars:
    text:
      To copy an existing page, hover over a page in an <a id="a11">Explorer page</a>, then click
      <b>More</b> and select <b>Copy</b>. Selecting <b>Copy</b> from the dropdown takes you to a form
      where you can enter the title and slug of the copy and also choose its parent page. You then get
      the option to publish the copy right away and an option to mark the copy as an alias of the original
      page. Once you have completed the form, click <b>Copy this page</b>.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s59'
  metadata:
    id: manage-pages-s59
    doc_id: manage-pages
  vars:
    text: Congratulations, you just copied a page. You can now find your copied page on the Explorer page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s60'
  metadata:
    id: manage-pages-s60
    doc_id: manage-pages
  vars:
    text: Alias pages
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s61'
  metadata:
    id: manage-pages-s61
    doc_id: manage-pages
  vars:
    text:
      When copying a page, you have the option to mark it as an alias. The content of an aliased page
      always stays in sync with the original.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s62'
  metadata:
    id: manage-pages-s62
    doc_id: manage-pages
  vars:
    text:
      This is useful when you want a page to be available in multiple places. For example, if you
      have a page about Brioche as a child page of Breads, and you want to make the Brioche page available
      in the Pastries section. One way to do this is to create a copy of the Brioche page and change the
      parent page to the Pastries page. However, you now need to remember to update this copy each time
      you modify the original page. If you mark a copy as an alias, Wagtail automatically makes changes
      to the copy each time you modify and publish the original page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s63'
  metadata:
    id: manage-pages-s63
    doc_id: manage-pages
  vars:
    text:
      Creating an alias for an existing page is similar to creating a copy. Hover over a page in the
      <a id="a12">Explorer page</a>, click <b>More</b>, and then select <b>Copy</b>. Selecting <b>Copy</b>
      takes you to the copy page form. On the copy page form, choose another page as the parent page by
      clicking Choose another page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s64'
  metadata:
    id: manage-pages-s64
    doc_id: manage-pages
  vars:
    text: Then, click the <b>Alias</b> checkbox and click <b>Copy this page</b> to complete the aliasing.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s65'
  metadata:
    id: manage-pages-s65
    doc_id: manage-pages
  vars:
    text:
      Congratulations, you just aliased a page. You can now find your aliased page on the <a id="a13">Explorer
      page</a> of the parent page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s66'
  metadata:
    id: manage-pages-s66
    doc_id: manage-pages
  vars:
    text:
      "If you try to edit the aliased page, you get a notification that it's an alias of another
      page. To edit an aliased page, you have two options:"
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s67'
  metadata:
    id: manage-pages-s67
    doc_id: manage-pages
  vars:
    text: Edit the original page. This option changes both the original page and the aliased page.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s68'
  metadata:
    id: manage-pages-s68
    doc_id: manage-pages
  vars:
    text:
      Convert the alias page to an ordinary page, which is a copy of the original. If you choose this
      option, you must make manual changes to the alias page in order for it to be in sync with the original
      page.
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s1'
  metadata:
    id: about-s1
    doc_id: about
  vars:
    text:
      The User Guide is a website to help content editors, moderators, administrators, and other users
      learn how to use the Wagtail content management system (CMS).
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s2'
  metadata:
    id: about-s2
    doc_id: about
  vars:
    text:
      The User Guide is a website to help content editors, moderators, administrators, and other users
      learn how to use <a id="a0">Wagtail</a>, the leading open source Python content management system
      (CMS). It’s comprehensive documentation for CMS users, including reference information on the admin
      features, how-tos, and more.
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s3'
  metadata:
    id: about-s3
    doc_id: about
  vars:
    text: AI-friendly documentation
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s4'
  metadata:
    id: about-s4
    doc_id: about
  vars:
    text:
      'For users of Large Language Models (LLMs), the user guide contents are available in LLM-friendly
      formats:'
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s5'
  metadata:
    id: about-s5
    doc_id: about
  vars:
    text: <a id="a1">llms.txt</a>, an LLM-focused index of all site contents.
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s6'
  metadata:
    id: about-s6
    doc_id: about
  vars:
    text: <a id="a2">llms-full.txt</a>, a full copy of the documentation
- description: 'Full page: about.md — 14 segments, 1572 chars — segment s7'
  metadata:
    id: about-s7
    doc_id: about
