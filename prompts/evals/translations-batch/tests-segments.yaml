    text:
      When making changes to a new or existing page, the page editor will periodically automatically
      save the page contents. This functionality is available for all page types by default, as well as
      <a id="a0">snippets</a> when configured by site implementers.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s5'
  metadata:
    id: manage-pages-s5
    doc_id: manage-pages
  vars:
    text:
      In addition to autosaving, the editor will also alert users of possible concurrent editing conflicts
      when multiple users are working on the same content. And flag internet connectivity and network
      issues that pop up as you work.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s6'
  metadata:
    id: manage-pages-s6
    doc_id: manage-pages
  vars:
    text: Edit existing pages
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s7'
  metadata:
    id: manage-pages-s7
    doc_id: manage-pages
  vars:
    text: You can access an existing page's <a id="a1">edit screen</a> in three ways.
- description: 'Full page: how-to-guides/manage-pages.md — 68 segments, 10964 chars — segment s8'
